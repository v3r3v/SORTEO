<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raffle Entry</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main class="card">
    <header class="header">
      <img class="company-logo" src="public/company_logo.png" alt="Blow by Alfredo Hernández — Hair &amp; Beauty Salon" />
      <h1 id="prizeTitle">Win the Prize!</h1>
      <p id="prizeSubtitle" class="subtitle">$5 = 1 entry. Up to 3 entries per payment.</p>
    </header>

    <figure class="prize-showcase">
      <img class="prize-image" src="public/products_for_winner.png" alt="This raffle's prize" />
      <figcaption>This is what you could win!</figcaption>
    </figure>

    <form id="entryForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required />
        <span class="error" id="nameError"></span>
      </div>

      <div class="field">
        <label for="phone">Cellphone number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" required />
        <span class="error" id="phoneError"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
        <span class="error" id="emailError"></span>
      </div>

      <div class="field">
        <label>Entries</label>
        <div class="preset-amounts" id="presetAmounts"></div>
        <span class="error" id="amountError"></span>
      </div>

      <div class="summary" id="summary" hidden>
        <span id="summaryText"></span>
      </div>

      <button type="submit" id="submitBtn">Get My Entries</button>
      <p class="status" id="statusMsg" role="status" aria-live="polite"></p>
    </form>

    <section id="payStep" class="pay-step" hidden>
      <p class="summary" id="paySummaryText"></p>
      <p class="hint">Tap below and confirm the payment in your ATH Móvil app.</p>
      <div id="ATHMovil_Checkout_Button_payment"></div>
      <button type="button" id="backToFormBtn" class="link-btn">← Edit my details</button>
      <p class="status" id="payStatusMsg" role="status" aria-live="polite"></p>
    </section>

    <section id="confirmation" class="confirmation" hidden>
      <h2>You're in! 🎉</h2>
      <p id="confirmationText"></p>
      <p class="reference">Reference ID: <code id="entryIdText"></code></p>
    </section>
  </main>

  <script src="https://payments.athmovil.com/api/modal/js/athmovil_base.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
